<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fibonacci Lab - Open Day</title>
<style>
  body { background: #0a0e14; color: #00ff88; font-family: 'Courier New', monospace; margin: 0; padding: 15px; text-align: center; }
  h1 { font-size: 1.4rem; text-shadow: 0 0 10px #00ff88; margin-bottom: 5px; }
  p.sub { color: #8892b0; font-size: 0.85rem; margin-top: 0; }
  .card { background: #111622; border: 1px solid #00ff88; border-radius: 10px; padding: 15px; margin: 15px auto; max-width: 450px; box-shadow: 0 0 15px rgba(0,255,136,0.15); }
  input[type="text"] { width: 90%; padding: 12px; background: #0a0e14; border: 1px solid #00ffff; color: #fff; font-size: 1.1rem; border-radius: 6px; text-transform: uppercase; text-align: center; margin-bottom: 10px; }
  .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  button { background: #00ff88; color: #0a0e14; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.95rem; }
  button.sec { background: #00ffff; }
  button.wa { background: #25D366; color: #fff; width: 100%; margin-top: 8px; }
  .output { background: #05070a; padding: 12px; border-radius: 6px; border: 1px dashed #ff0055; color: #ff0055; font-size: 1.3rem; font-weight: bold; letter-spacing: 2px; word-break: break-all; min-height: 28px; }
  canvas { background: #000; border-radius: 8px; border: 1px solid #333; max-width: 100%; margin-top: 10px; }
  .slider-box { margin: 10px 0; font-size: 0.9rem; color: #00ffff; }
  input[type="range"] { width: 85%; accent-color: #00ff88; }
</style>
</head>
<body>

  <h1>⚡ CYBER FIBONACCI LAB</h1>
  <p class="sub">Sequenza: 1, 1, 2, 3, 5, 8, 13, 21...</p>

  <!-- SEZIONE 1: CRITTOGRAFIA -->
  <div class="card">
    <h2 style="margin-top:0; font-size:1.1rem; color:#00ffff;">🔐 Cifratore Segreto</h2>
    <input type="text" id="testo" placeholder="SCRIVI QUI IL MESSAGGIO..." oninput="elabora(1)">
    <div class="btn-group">
      <button onclick="elabora(1)">🔒 CIFRA (+)</button>
      <button class="sec" onclick="elabora(-1)">🔓 DECIFRA (-)</button>
    </div>
    <div class="output" id="risultato">...</div>
    <button class="wa" onclick="condividiWA()">📲 Invia codice su WhatsApp</button>
  </div>

  <!-- SEZIONE 2: GRAFICA AUREA -->
  <div class="card">
    <h2 style="margin-top:0; font-size:1.1rem; color:#00ffff;">🌌 Generatore Galassia</h2>
    <div class="slider-box">
      Angolo: <span id="valAngolo">137.5</span>°<br>
      <input type="range" id="angolo" min="60" max="180" step="0.1" value="137.5" oninput="disegna()">
    </div>
    <div class="slider-box">
      Punti Fibonacci: <span id="valPunti">350</span><br>
      <input type="range" id="punti" min="50" max="600" step="10" value="350" oninput="disegna()">
    </div>
    <canvas id="tela" width="320" height="320"></canvas>
    <button style="width:100%; margin-top:10px;" onclick="scaricaImg()">💾 Salva Immagine sul Telefono</button>
  </div>

<script>
  const alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  function elabora(direzione) {
    let msg = document.getElementById("testo").value.toUpperCase();
    let a = 1, b = 1, out = "";
    for (let i = 0; i < msg.length; i++) {
      let c = msg[i];
      let pos = alfabeto.indexOf(c);
      if (pos !== -1) {
        let nuovaPos = (pos + (direzione * a)) % 26;
        if (nuovaPos < 0) nuovaPos += 26;
        out += alfabeto[nuovaPos];
        let prox = a + b; a = b; b = prox;
      } else {
        out += c;
      }
    }
    document.getElementById("risultato").innerText = out || "...";
  }

  function condividiWA() {
    let res = document.getElementById("risultato").innerText;
    if (res === "...") return;
    let url = "https://github.io";
    let testoWA = "🕵️‍♂️ Ho cifrato un messaggio con l'algoritmo di Fibonacci all'Open Day!\n\nCodice: *" + res + "*\n\nProva a decifrarlo qui: " + url;
    window.open("https://wa.me" + encodeURIComponent(testoWA), "_blank");
  }

  function disegna() {
    let canvas = document.getElementById("tela");
    let ctx = canvas.getContext("2d");
    let ang = parseFloat(document.getElementById("angolo").value);
    let n = parseInt(document.getElementById("punti").value);
    document.getElementById("valAngolo").innerText = ang;
    document.getElementById("valPunti").innerText = n;

    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let colori = ["#00FFCC", "#FF007F", "#FFFF00", "#00BFFF", "#7FFF00"];
    let cx = canvas.width / 2, cy = canvas.height / 2;

    for (let i = 0; i < n; i++) {
      let r = i * 0.25;
      let theta = i * ang * (Math.PI / 180);
      let x = cx + r * Math.cos(theta);
      let y = cy + r * Math.sin(theta);

      ctx.beginPath();
      ctx.arc(x, y, 2 + (i * 0.004), 0, 2 * Math.PI);
      ctx.fillStyle = colori[i % colori.length];
      ctx.fill();
    }
  }

  function scaricaImg() {
    let link = document.createElement('a');
    link.download = 'galassia-fibonacci.png';
    link.href = document.getElementById('tela').toDataURL();
    link.click();
  }

  disegna();
</script>
</body>
</html>
